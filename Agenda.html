<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Arcane Vallérois - Alchimie du Jeu</title>
    <link rel="stylesheet" href="styles/Fixed_banner.css"/>
    <link rel="stylesheet" href="styles/common.css"/>
  </head>
<body>
<div class="fixed-banner">
<img src="./assets/logo_hexag.webp" alt="Logo de l'Arcane Vallerois" class="logo" />
    <h1>Arcane Vallérois</h1>
    <button id="menu-toggle-button" aria-expanded="false" aria-controls="fixed-sidebar">
    ☰ </button>
</div>

<div class="main-layout">
<div id="banner-container"></div>  
  
  <div class="main-content">  
<h2>Prochains rendez-vous</h2>
    
    <div id="events-container" class="events-grid"></div>
  </div>
    <script>
        
        async function chargerEvenements() {
    const container = document.getElementById('events-container');

    try {
        // Récupération du fichier local
        //const response = await fetch('./event.txt');
const response = await fetch('https://github.com/Zabyon/Arcane-vallerois-evenement/raw/refs/heads/main/evenement.txt');
      
        if (!response.ok) throw new Error('Erreur de chargement du fichier');
        
        const text = await response.text();
        
        // Conversion du format (le fichier est une liste d'objets séparés par des virgules)
        // On l'entoure de crochets pour en faire un tableau JSON valide
        let rawData = JSON.parse(`[${text}]`);
        const now = new Date().setHours(0, 0, 0, 0);

        // Tri par date (optionnel mais recommandé)
        rawData = rawData
            .filter(item => new Date(item.Date) >= now) // Correction de item.date -> item.Date
            .sort((a, b) => new Date(a.Date) - new Date(b.Date))
            .slice(0, 5); // On ne garde que les 5 premiers

        // Génération du contenu
        container.innerHTML = rawData.map(event => `
            <div class="event-card" id="event-${event.Id}">
                <h3>${event.Nom}</h3>
                <p class="type"><strong>Type :</strong> ${event.Type || 'Non spécifié'}</p>
                <p class="date"><strong>Date :</strong> ${new Date(event.Date).toLocaleDateString('fr-FR')}</p>
                <p class="lieu"><strong>Lieu :</strong>📍 ${event.Lieu}</p>
                <p class="description">${event.Description.replace(/\n/g, '<br>')}</p>
            </div>
        `).join('');

    } catch (error) {
        container.innerHTML = `<p class="error">Erreur : ${error.message}</p>`;
    }
}

// Exécution
chargerEvenements();

    </script>  
  
  
  

<script src=./scripts/JS-Nav.js> </script>
<script src=./scripts/load-navigation.js> </script>

</body>
</html>

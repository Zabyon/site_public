<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>État-Major Impérial - Saint-Vallier-de-Thiey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Tangerine:wght@700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="../escape.css"/>

</head>
<body>

    <div class="document-wrapper">
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration top-right"></div>
        <div class="corner-decoration bottom-left"></div>
        <div class="corner-decoration bottom-right"></div>

        <header>
            <div class="imperial-header">Grande Armée — État-Major Général</div>
            <h1>Carte Topographique</h1>
            <div class="subtitle">Environs de Saint-Vallier-de-Thiey</div>
        </header>

        <main>
            <div class="map-container">
                <!-- <img src="https://generative-placeholders.glitch.me/image?width=600&height=1200&img=1" alt="Carte Napoléonienne de Saint-Vallier-de-Thiey">  -->
                 <img src="../assets/CarteSaintVallierNapoleon.webp" alt="Carte Napoléonienne de Saint-Vallier-de-Thiey">
           
            </div>
            <div class="map-caption">
                Dépôt Général de la Guerre — An X (1801)
            </div>

            <div class="action-container">
                <a href="https://www.google.com" class="parchment-btn" id="dispatchBtn">
                    Transmettre la réponse
                </a>
            </div>
        </main>

        <footer>
            Service Cartographique Impérial — Répertoire Tactique
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('dispatchBtn');
            
            btn.addEventListener('click', (e) => {
                // Animation de confirmation visuelle avant redirection
                btn.style.opacity = '0.8';
                btn.innerText = 'Transmission...';
            });
        });
    </script>
</body>
</html>
